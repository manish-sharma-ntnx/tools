<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSP Pipeline Health · Nutanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="bg-gradient"></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 6 L20 20 L6 34" fill="none" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 6 L20 20 L34 34" fill="none" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#6D45E8"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3BC9DB"/><stop offset="1" stop-color="#6D45E8"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="brand-text">
        <h1>MSP Pipeline Health</h1>
        <span class="brand-sub">Jenkins CI · Devtest · Master · Patch Releases</span>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="live-indicator" id="live-indicator">
        <span class="dot"></span><span id="live-text">Live</span>
      </div>
      <div class="updated" id="updated">—</div>
      <button class="btn btn-primary" id="btn-refresh" title="Re-discover version pipelines from Jenkins">
        <span class="btn-spinner" id="refresh-spinner"></span>
        <span id="refresh-label">Fetch latest releases</span>
      </button>
    </div>
  </header>

  <section class="summary" id="summary">
    <!-- KPI cards injected -->
  </section>

  <div class="alert-banner" id="alert-banner" hidden></div>

  <main id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Querying Jenkins controllers…</p>
    </div>
  </main>

  <footer class="footer">
    <span>Read-only Jenkins polling · Auto-alerts to <code id="foot-channel">#test-msp</code></span>
    <span class="footer-controllers" id="foot-controllers"></span>
  </footer>

  <!-- Build detail popover -->
  <div class="popover" id="popover" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
